<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portafolio | Ismael Estrada</title>
<style>
:root{--bg:#000;--panel:#0b0b0b;--line:#222;--text:#f5f5f5;--muted:#a1a1aa;--accent:#2563eb;--accent-h:#1d4ed8}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:16px/1.65 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
a{color:inherit;text-decoration:none}
canvas#rain{position:fixed;inset:0;z-index:0;pointer-events:none}
header,main,footer{position:relative;z-index:1}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
.logo{font-weight:700;font-size:22px;letter-spacing:-.5px}
nav{display:flex;gap:22px;font-size:14px;color:var(--muted)}
nav a:hover{color:var(--text)}
.icons{display:flex;gap:8px}
.icons a{width:34px;height:34px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.icons a:hover{color:var(--text);border-color:#555}
.hero{min-height:calc(100vh - 64px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 0}
.avatar{width:160px;height:160px;border-radius:50%;object-fit:cover;border:2px solid var(--line);display:grid;place-items:center;background:var(--panel);font-size:48px;font-weight:700;color:var(--muted);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:clamp(32px,6vw,48px);line-height:1.15;margin:28px 0 12px;letter-spacing:-1px}
.sub{color:var(--muted);max-width:520px}
.btns{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.btn{padding:10px 18px;border-radius:6px;font-size:14px;border:1px solid #555;transition:.15s}
.btn:hover{border-color:#999}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-h)}
section{padding:72px 0;border-top:1px solid var(--line);background:rgba(0,0,0,.82)}
h2{font-size:28px;margin-bottom:28px;letter-spacing:-.5px}
.about{max-width:68ch;color:#d4d4d8}
.about-row{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
#fotoSobre{width:200px;height:200px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.banner{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#111;border:1px solid var(--line)}
.job{display:grid;grid-template-columns:1fr auto;gap:2px 16px;margin-bottom:34px}
.job h3{font-size:18px}
.job .date{color:var(--muted);font-size:14px;font-style:italic}
.job .role{color:var(--muted);grid-column:1/-1}
.job ul{grid-column:1/-1;margin:10px 0 0 20px;color:#d4d4d8}
.job li{margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{border:1px solid var(--line);border-radius:10px;padding:20px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.card:hover{border-color:#444}
.card h3{font-size:18px}
.card p{color:#d4d4d8;font-size:15px;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;padding:2px 10px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.links{display:flex;gap:16px;font-size:14px}
.links a{color:#60a5fa}
.links a:hover{text-decoration:underline}
.skills{display:grid;gap:16px}
.skills div{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:start}
.skills b{font-weight:600;color:var(--muted)}
.edu{margin-bottom:18px}
.edu span{color:var(--muted);font-size:14px}
.contact p{color:var(--muted);margin-bottom:18px}
footer{padding:28px 0;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line);background:#000}
a:focus-visible,.btn:focus-visible{outline:2px solid #60a5fa;outline-offset:3px}
@media(max-width:640px){nav{display:none}.skills div{grid-template-columns:1fr;gap:4px}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>

<header>
  <div class="wrap">
    <a href="#inicio" class="logo" id="logo"></a>
    <nav>
      <a href="#proyectos">Proyectos</a><a href="#educacion">Educación</a>
      <a href="#habilidades">Habilidades</a><a href="#sobre-mi">Sobre mí</a><a href="#contacto">Contacto</a>
    </nav>
    <div class="icons" id="icons"></div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="hero" id="inicio">
      <div class="avatar" id="avatar"></div>
      <h1 id="titulo"></h1>
      <p class="sub" id="subtitulo"></p>
      <div class="btns">
        <a class="btn" id="btnContacto" href="#contacto">Contacto</a>
        <a class="btn primary" id="btnCV" target="_blank" rel="noopener">Ver CV</a>
      </div>
    </div>
  </div>

  <section id="proyectos"><div class="wrap"><h2>Proyectos destacados</h2><div class="grid" id="proy"></div></div></section>
  <section id="educacion"><div class="wrap"><h2>Educación</h2><div id="edu"></div></div></section>
  <section id="habilidades"><div class="wrap"><h2>Habilidades</h2><div class="skills" id="skills"></div></div></section>
  <section id="experiencia"><div class="wrap"><h2>Experiencia profesional</h2><div id="exp"></div></div></section>
  <section id="sobre-mi"><div class="wrap"><h2>Sobre mí</h2>
    <div class="about-row"><p class="about" id="sobre"></p><img id="fotoSobre" alt="" hidden></div></div></section>
  <section id="contacto"><div class="wrap contact"><h2>Contacto</h2><p id="contactoTxt"></p>
    <div class="btns" style="justify-content:flex-start"><a class="btn primary" id="wa" target="_blank" rel="noopener"></a><a class="btn" id="mail"></a></div></div></section>
</main>

<footer><div class="wrap" id="pie"></div></footer>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

else av.textContent = DATA.nombreCompleto.replace(/[\[\]]/g,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();

/* ===================== Lluvia de líneas (fondo del hero) ===================== */
(function(){
  const c = $("rain"), x = c.getContext("2d");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let w, h, drops = [];
  function size(){ w = c.width = innerWidth; h = c.height = innerHeight;
    drops = Array.from({length: Math.floor(w/22)}, () => ({x:Math.random()*w, y:Math.random()*h, l:30+Math.random()*90, v:1+Math.random()*3, a:.15+Math.random()*.35})); }
  size(); addEventListener("resize", size);
  (function draw(){
    x.clearRect(0,0,w,h);
    for (const d of drops){
      const g = x.createLinearGradient(0,d.y-d.l,0,d.y);
      g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(1,`rgba(255,255,255,${d.a})`);
      x.strokeStyle = g; x.lineWidth = 1; x.beginPath(); x.moveTo(d.x,d.y-d.l); x.lineTo(d.x,d.y); x.stroke();
      d.y += d.v; if (d.y - d.l > h){ d.y = -10; d.x = Math.random()*w; }
    }
    requestAnimationFrame(draw);
  })();
})();
</script>
